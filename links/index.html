<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carcarar — Links</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --laranja: #E74011;
    --preto: #0A0A0A;
    --cinza: #8a8a8a;
    --cinza-escuro: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Lexend Deca', sans-serif;
    background: var(--preto);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Glow ambiente, ecoando a capa dos outros documentos */
  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 140vw;
    max-width: 900px;
    height: 60vh;
    background: radial-gradient(ellipse at center, rgba(231,64,17,0.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Marca */
  .marca {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 8px;
  }

  .marca-logo {
    width: 220px;
    height: auto;
    margin-bottom: 8px;
  }

  .marca-logo svg { width: 100%; height: auto; display: block; }

  .marca-linha {
    width: 28px;
    height: 1px;
    background: var(--laranja);
    margin-bottom: 18px;
  }

  .marca-nome {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 7px;
    color: #fff;
    text-transform: uppercase;
  }

  .marca-nome span { color: var(--laranja); }

  .marca-tag {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 2.5px;
    color: var(--cinza);
    text-transform: uppercase;
    margin-top: 8px;
  }

  /* Frase de posicionamento */
  .frase {
    text-align: center;
    font-size: 13.5px;
    font-weight: 300;
    color: #999;
    line-height: 1.6;
    max-width: 300px;
    margin: 22px 0 40px;
  }

  .frase strong { color: #fff; font-weight: 600; }

  /* Links */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 18px 22px;
    background: var(--cinza-escuro);
    border: 1px solid #262626;
    text-decoration: none;
    color: #fff;
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .link-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--laranja);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }

  .link-card:active { transform: scale(0.98); }

  .link-card:hover {
    border-color: rgba(231,64,17,0.4);
    background: #1f1310;
  }

  .link-card:hover::before { transform: scaleY(1); }

  .link-icon {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(231,64,17,0.1);
    border: 1px solid rgba(231,64,17,0.25);
  }

  .link-icon svg { width: 20px; height: 20px; }

  .link-body { flex: 1; min-width: 0; }

  .link-eyebrow {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--laranja);
    text-transform: uppercase;
    margin-bottom: 3px;
    display: block;
  }

  .link-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
  }

  .link-sub {
    font-size: 11.5px;
    font-weight: 300;
    color: var(--cinza);
    margin-top: 2px;
  }

  .link-arrow {
    font-size: 16px;
    color: #555;
    flex-shrink: 0;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .link-card:hover .link-arrow {
    color: var(--laranja);
    transform: translateX(3px);
  }

  /* Rodapé */
  .rodape {
    margin-top: 44px;
    text-align: center;
  }

  .rodape-cidade {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #666;
    text-transform: uppercase;
  }

  .rodape-cnpj {
    font-size: 9px;
    font-weight: 300;
    color: #3a3a3a;
    letter-spacing: 0.5px;
    margin-top: 6px;
  }

  @media (max-width: 380px) {
    .link-card { padding: 16px 18px; gap: 13px; }
    .link-icon { width: 38px; height: 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
